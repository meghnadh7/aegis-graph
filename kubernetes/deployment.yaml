apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegisgraph-api
  labels:
    app: aegisgraph
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aegisgraph
  template:
    metadata:
      labels:
        app: aegisgraph
    spec:
      containers:
        - name: api
          image: aegisgraph:0.1.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: aegisgraph-config
            - secretRef:
                name: aegisgraph-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
