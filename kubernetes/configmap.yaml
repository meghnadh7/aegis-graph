apiVersion: v1
kind: ConfigMap
metadata:
  name: aegisgraph-config
data:
  MOCK_MODE: "false"
  LLM_PROVIDER: "anthropic"
  LLM_MODEL: "claude-opus-4-5"
  LANGCHAIN_TRACING_V2: "true"
  LANGCHAIN_PROJECT: "aegisgraph"
  PINECONE_INDEX_NAME: "aegisgraph"
  CONFIDENCE_THRESHOLD: "0.75"
  MAX_REVISION_LOOPS: "2"
