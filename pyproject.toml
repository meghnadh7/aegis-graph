[project]
name = "aegisgraph"
version = "0.1.0"
description = "Multi-tenant autonomous SOC triage copilot built on LangGraph + MCP"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Meghna Bijnapally"}]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "ingestion*", "mcp_servers*", "knowledge_base*", "guardrails*", "case_management*", "evals*", "tenants*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
